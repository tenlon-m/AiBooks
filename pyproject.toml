[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibooks"
version = "0.1.0"
description = "AI 全自动小说撰写软件 - 基于免费在线 AI 大模型"
readme = "README.md"
requires-python = ">=3.12.9"
license = {text = "LGPL-3.0-only"}

dependencies = [
    "PySide6>=6.7",
    "FastAPI>=0.110",
    "Uvicorn>=0.27",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "markdown>=3.5",
    "cryptography>=42",
    "loguru>=0.7",
    "pydantic-settings>=2.2",
    "pydantic>=2.6",
    "Jinja2>=3.1",
    "watchfiles>=0.21",
    "APScheduler>=3.10",
    "PyInstaller>=6.0",
    "aiosqlite>=0.20",
    "EbookLib>=0.18",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "Pillow>=10.0",
]

[project.scripts]
aibooks = "src.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]